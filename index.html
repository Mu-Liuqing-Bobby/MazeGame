<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷宫 V6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101217;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:#353b47;border:1px solid #697282;border-radius:9px;touch-action:manipulation}.hidden{display:none!important}
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{margin:0 0 8px}.sub,.hint{color:#9aa1ad;text-align:center}.levels{width:min(900px,94vw);display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:50vh;overflow:auto}
.level{min-height:44px}.level.done{background:#36533f}.level.lock{opacity:.45}.menuBtn{width:min(360px,84vw);margin-top:8px;padding:9px}.smallBtn{margin-top:7px;padding:7px 12px}
#bar{height:42px;flex:0 0 42px;width:96%;display:flex;align-items:center;justify-content:space-between;gap:8px}#back{padding:6px 10px}
#gameArea{width:96%;height:calc(100% - 42px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0;padding:4px 0}
#mazeStage{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;max-width:100%;max-height:100%;touch-action:none}
#controls{display:none;flex:0 0 auto;flex-direction:column;align-items:center;gap:4px;padding:2px}
#controls div{display:flex;gap:4px}#controls button{width:48px;height:40px;font-size:18px}#padCenter{opacity:.35}
@media(pointer:coarse){#controls{display:flex}}
@media(max-width:700px){.levels{grid-template-columns:repeat(3,1fr)}#bar{height:38px;flex-basis:38px}#gameArea{height:calc(100% - 38px);gap:3px}#controls button{width:46px;height:36px}}
@media(pointer:coarse) and (orientation:portrait){#gameArea{padding-bottom:2px}}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}.box{width:min(380px,88vw);padding:18px;background:#20252e;border:1px solid #697282;border-radius:13px;text-align:center}.box input{width:190px;padding:9px;background:#292e37;color:#fff;border:1px solid #687282;border-radius:8px;text-align:center}
</style></head><body>
<section id="menu" class="screen"><h1>迷 宫</h1><div class="sub">V6 · 经典30关 + 迷雾15关</div><div id="levels" class="levels"></div>
<button id="fogBtn" class="menuBtn">🌫️ 迷雾模式</button><button id="customBtn" class="menuBtn">自定义迷宫</button>
<button id="adminBtn" class="smallBtn">管理员模式</button><button id="resetBtn" class="smallBtn">重置进度</button>
<div class="hint">不计时、不计步数 · 7-1后少量钥匙和门</div></section>
<section id="fogMenu" class="screen hidden"><h1>🌫️ 迷雾模式</h1><div id="fogLevels" class="levels"></div><button id="fogBack" class="menuBtn">← 返回</button></section>
<section id="game" class="screen hidden"><div id="bar"><button id="back">← 菜单</button><b id="title"></b><span id="status"></span></div>
<div id="gameArea"><div id="mazeStage"><canvas id="cv"></canvas></div><div id="controls"><button data-d="0,-1">▲</button><div><button data-d="-1,0">◀</button><button id="padCenter" disabled>●</button><button data-d="1,0">▶</button></div><button data-d="0,1">▼</button></div></div></section>
<section id="complete" class="screen hidden"><h1>通关！</h1><p id="ct"></p><button id="next" class="menuBtn"></button><button id="cm" class="menuBtn">返回列表</button></section>
<section id="custom" class="screen hidden"><h1>自定义迷宫</h1><div class="sub">7×7 ～ 99×99</div><p>宽 <input id="cw" type="number" value="25" min="7" max="99"> 高 <input id="ch" type="number" value="25" min="7" max="99"></p><button id="gen" class="menuBtn">生成</button><button id="cb" class="menuBtn">返回</button></section>
<div id="modal" class="modal hidden"><div class="box"><h2 id="mt"></h2><p id="mx"></p><input id="mi" type="password" inputmode="numeric"><br><button id="mok" class="menuBtn">确定</button><button id="mno" class="menuBtn">取消</button></div></div>
<script>
"use strict";
const SKEY="maze_v6_save",AKEY="maze_v6_admin";
const st={normal:new Set(),fog:new Set(),admin:false,cfg:null,a:null,s:[1,1],e:[1,1],p:[1,1],keys:[],doors:[],moving:false};
const normal=[],fog=[];
for(let i=0;i<30;i++){let z=Math.min(15+Math.floor(i*2.1),80);if(!(z&1))z--;normal.push({type:"normal",index:i,id:`${Math.floor(i/3)+1}-${i%3+1}`,w:z,h:z,doors:i>=6,d:i+1})}
for(let i=0;i<15;i++){let z=Math.min(17+Math.floor(i*2.5),55);if(!(z&1))z--;fog.push({type:"fog",index:i,id:`F-${i+1}`,w:z,h:z,d:i+1})}
const $=x=>document.getElementById(x), screens=[$("menu"),$("fogMenu"),$("game"),$("complete"),$("custom")];
function show(x){screens.forEach(s=>s.classList.add("hidden"));x.classList.remove("hidden")}
function save(){localStorage.setItem(SKEY,JSON.stringify({v:6,normal:[...st.normal],fog:[...st.fog],admin:st.admin,t:Date.now()}))}
function load(){try{let d=JSON.parse(localStorage.getItem(SKEY)||"{}");if(d.v===6){st.normal=new Set(d.normal||[]);st.fog=new Set(d.fog||[]);st.admin=d.admin||false}else{let old=JSON.parse(localStorage.getItem("maze_v5_progress")||"[]");st.normal=new Set(old)}}catch(e){}}
function all(){return st.admin||st.normal.size===30}
function unlocked(arr,i,set){return st.admin||i===0||set.has(i-1)}
function render(arr,box,set){$(box).innerHTML="";arr.forEach((v,i)=>{let b=document.createElement("button");let u=unlocked(arr,i,set),done=set.has(i);b.className="level "+(done?"done ":"")+(u?"":"lock");b.disabled=!u;b.textContent=done?v.id+" ✓":u?v.id:v.id+" 🔒";b.onclick=()=>start(v);$(box).appendChild(b)})}

function maze(w,h){
 if(!(w&1))w--;if(!(h&1))h--;let a=Array.from({length:h},()=>Array(w).fill(0)),q=[[1,1]];a[1][1]=1;
 while(q.length){let [x,y]=q[q.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=0;
  for(let [dx,dy] of ds){let X=x+dx,Y=y+dy;if(X>0&&X<w-1&&Y>0&&Y<h-1&&!a[Y][X]){a[y+dy/2][x+dx/2]=1;a[Y][X]=1;q.push([X,Y]);ok=1;break}}if(!ok)q.pop()}
 let leaves=[];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)if(a[y][x]){let n=(a[y-1][x]?1:0)+(a[y+1][x]?1:0)+(a[y][x-1]?1:0)+(a[y][x+1]?1:0);if(n===1)leaves.push([x,y])}
 let s=[1,1],e=[w-2,h-2],best=-1;for(let A of leaves)for(let B of leaves){let d=Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1]);if(d>best){best=d;s=A;e=B}}return[a,s,e]
}
function path(a,s,e){let q=[s],pr=new Map(),K=(x,y)=>x+","+y;pr.set(K(...s),null);while(q.length){let [x,y]=q.shift();if(x===e[0]&&y===e[1]){let o=[],c=[x,y];while(c){o.push(c);c=pr.get(K(...c))}return o.reverse()}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let X=x+dx,Y=y+dy,k=K(X,Y);if(Y>=0&&Y<a.length&&X>=0&&X<a[0].length&&a[Y][X]&&!pr.has(k)){pr.set(k,[x,y]);q.push([X,Y])}}}return[]}
function valid(a,s,e){let h=a.length,w=a[0].length;for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++)if(a[y][x]&&a[y+1][x]&&a[y][x+1]&&a[y+1][x+1])return false;return path(a,s,e).length>0}
function gen(c){for(let i=0;i<40;i++){let m=maze(c.w,c.h);if(valid(...m))return m}return maze(c.w,c.h)}

function setupDoors(c){
 st.keys=[];st.doors=[];
 if(c.type!=="normal"||!c.doors)return;
 let p=path(st.a,st.s,st.e);if(!p||p.length<15)return;
 let n=c.d>=23?2:1;
 n=Math.min(n,4);
 let used=new Set();
 for(let i=0;i<n;i++){
  let kIdx=Math.floor(p.length*(.2+i*.18)),dIdx=Math.min(p.length-3,kIdx+Math.max(7,Math.floor(p.length*.12)));
  if(dIdx<=kIdx+2)continue;
  while(used.has(kIdx)&&kIdx<dIdx-3)kIdx++;
  while(used.has(dIdx)&&dIdx>kIdx+3)dIdx--;
  if(used.has(kIdx)||used.has(dIdx))continue;
  used.add(kIdx);used.add(dIdx);
  st.keys.push({x:p[kIdx][0],y:p[kIdx][1],got:false,i});
  st.doors.push({x:p[dIdx][0],y:p[dIdx][1],open:false,i});
 }
}

function start(c){st.cfg=c;let m=gen(c);st.a=m[0];st.s=m[1];st.e=m[2];st.p=[...st.s];setupDoors(c);$("title").textContent=c.type==="fog"?"🌫️ "+c.id:c.type==="custom"?"自定义迷宫":"关卡 "+c.id;upd();show($("game"));resize();draw()}
const cv=$("cv"),ctx=cv.getContext("2d");
function resize(){if(!st.a)return;let stage=$("mazeStage"),w=st.a[0].length,h=st.a.length,c=Math.max(2,Math.floor(Math.min((stage.clientWidth-2)/w,(stage.clientHeight-2)/h)));cv.width=w*c;cv.height=h*c;cv.dataset.c=c}
function vis(x,y){return st.cfg.type!=="fog"||Math.abs(x-st.p[0])+Math.abs(y-st.p[1])<=4}
function draw(){let c=+cv.dataset.c||4;ctx.fillStyle="#080a0f";ctx.fillRect(0,0,cv.width,cv.height);for(let y=0;y<st.a.length;y++)for(let x=0;x<st.a[0].length;x++){if(!vis(x,y))continue;ctx.fillStyle=st.a[y][x]?"#e7eaf0":"#2c313a";ctx.fillRect(x*c,y*c,c,c)}
 function box(x,y,color){ctx.fillStyle="#111";ctx.fillRect(x*c+.08*c,y*c+.08*c,.84*c,.84*c);ctx.fillStyle=color;ctx.fillRect(x*c+.18*c,y*c+.18*c,.64*c,.64*c)}
 if(vis(...st.s))box(...st.s,"#21e66b");if(vis(...st.e))box(...st.e,"#ff334c");
 for(let k of st.keys)if(!k.got&&vis(k.x,k.y))box(k.x,k.y,"#ffd21a");for(let d of st.doors)if(!d.open&&vis(d.x,d.y))box(d.x,d.y,"#b126ff");
 ctx.fillStyle="#2585ff";ctx.beginPath();ctx.arc(st.p[0]*c+c/2,st.p[1]*c+c/2,Math.max(3,c*.31),0,7);ctx.fill()}
function upd(){if(st.keys.length)$("status").textContent="🔑 "+st.keys.filter(k=>k.got).length+"/"+st.keys.length;else if(st.cfg&&st.cfg.type==="fog")$("status").textContent="🌫️ 记路线";else $("status").textContent=""}

function move(dx,dy){
 if(st.moving||!st.a)return;
 let x=st.p[0]+dx,y=st.p[1]+dy;
 if(y<0||x<0||y>=st.a.length||x>=st.a[0].length||!st.a[y][x])return;
 let d=st.doors.find(d=>d.x===x&&d.y===y&&!d.open);
 if(d){let k=st.keys.find(k=>k.i===d.i&&!k.got);if(!k)return;d.open=true}
 let k=st.keys.find(k=>k.x===x&&k.y===y&&!k.got);if(k)k.got=true;
 st.p=[x,y];st.moving=true;setTimeout(()=>st.moving=false,120);upd();draw();
 if(x===st.e[0]&&y===st.e[1])finish()
}

document.addEventListener("keydown",e=>{if(e.repeat||st.moving||["input","textarea"].includes((e.target.tagName||"").toLowerCase()))return;let d=null,k=e.key.toLowerCase();if(k==="w"||e.key==="ArrowUp")d=[0,-1];if(k==="s"||e.key==="ArrowDown")d=[0,1];if(k==="a"||e.key==="ArrowLeft")d=[-1,0];if(k==="d"||e.key==="ArrowRight")d=[1,0];if(d){e.preventDefault();move(...d)}})
document.querySelectorAll("#controls [data-d]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();move(...b.dataset.d.split(",").map(Number))}));
let ts=null;cv.addEventListener("touchstart",e=>{let t=e.changedTouches[0];ts=[t.clientX,t.clientY]},{passive:true});cv.addEventListener("touchend",e=>{if(!ts)return;let t=e.changedTouches[0],dx=t.clientX-ts[0],dy=t.clientY-ts[1];ts=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1)},{passive:true})

function finish(){
 let c=st.cfg;
 if(c.type==="normal"){st.normal.add(c.index);save();$("ct").textContent="完成 "+c.id+"！";$("next").textContent=c.index<29?"进入下一关":"进入迷雾关卡列表";$("next").onclick=()=>c.index<29?start(normal[c.index+1]):(render(fog,"fogLevels",st.fog),show($("fogMenu")))}
 else if(c.type==="fog"){st.fog.add(c.index);$("ct").textContent="完成 "+c.id+"！";$("next").textContent="返回迷雾关卡列表";$("next").onclick=()=>{render(fog,"fogLevels",st.fog);show($("fogMenu"))}}
 else{$("ct").textContent="自定义迷宫通关！";$("next").textContent="再来一张";$("next").onclick=startCustom}
 show($("complete"))
}
function modal(title,text,cb){$("mt").textContent=title;$("mx").textContent=text;$("mi").value="";$("modal").classList.remove("hidden");$("mok").onclick=()=>{$("modal").classList.add("hidden");cb($("mi").value)};$("mno").onclick=()=>$("modal").classList.add("hidden")}
$("adminBtn").onclick=()=>modal("管理员模式","请输入管理员密码。",v=>{if(v==="235689850525"){st.admin=true;st.normal=new Set([...Array(30).keys()]);st.fog=new Set([...Array(15).keys()]);localStorage.setItem(AKEY,"1");save();render(normal,"levels",st.normal);render(fog,"fogLevels",st.fog)}else alert("密码错误")});
$("resetBtn").onclick=()=>modal("确认重置","请输入 RESET 以确认。",v=>{if(v==="RESET"){st.normal.clear();st.fog.clear();st.admin=false;localStorage.removeItem(AKEY);localStorage.removeItem(SKEY);save();render(normal,"levels",st.normal);render(fog,"fogLevels",st.fog);alert("进度已重置")}});
$("fogBtn").onclick=()=>{if(all()){render(fog,"fogLevels",st.fog);show($("fogMenu"))}};$("fogBack").onclick=()=>show($("menu"));$("back").onclick=()=>{st.a=null;render(normal,"levels",st.normal);show($("menu"))};$("cm").onclick=()=>{if(st.cfg&&st.cfg.type==="fog"){render(fog,"fogLevels",st.fog);show($("fogMenu"))}else{render(normal,"levels",st.normal);show($("menu"))}};
function startCustom(){let w=Math.max(7,Math.min(99,+$("cw").value||25)),h=Math.max(7,Math.min(99,+$("ch").value||25));if(!(w&1))w--;if(!(h&1))h--;start({type:"custom",id:"自定义",w,h,d:10})}
$("customBtn").onclick=()=>{if(all())show($("custom"))};$("gen").onclick=startCustom;$("cb").onclick=()=>show($("menu"));
function refresh(){if(st.a){resize();draw()}}addEventListener("resize",refresh);addEventListener("orientationchange",()=>setTimeout(refresh,150));if(visualViewport)visualViewport.addEventListener("resize",refresh);
load();render(normal,"levels",st.normal);render(fog,"fogLevels",st.fog);show($("menu"));
</script></body></html>
