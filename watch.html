<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷宫 Watch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101217;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:#353b47;border:1px solid #697282;border-radius:9px;touch-action:manipulation}.hidden{display:none!important}
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
h1{margin:0 0 6px;font-size:1.2rem}.sub,.hint{color:#9aa1ad;text-align:center;font-size:.8rem}
.phases{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:60vh;overflow:auto}
.phase{min-height:50px;font-size:.9rem}.phase.done{background:#36533f}.phase.lock{opacity:.45}
.levels{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.level{min-height:44px;font-size:.85rem}.level.done{background:#36533f}.level.lock{opacity:.45}
.fogLevels{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fogLevel{min-height:44px;font-size:.85rem}.fogLevel.done{background:#36533f}.fogLevel.lock{opacity:.45}
.menuBtn{width:90%;margin-top:6px;padding:8px;font-size:.9rem}.smallBtn{margin-top:6px;padding:6px 10px;font-size:.8rem}
#bar{height:36px;flex:0 0 36px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px}#back{padding:5px 8px;font-size:.8rem}
#gameArea{width:100%;height:calc(100% - 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#mazeStage{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;max-width:100%;max-height:100%;touch-action:none}
#controls{display:flex;flex:0 0 auto;flex-direction:column;align-items:center;gap:3px;padding:2px}
#controls div{display:flex;gap:3px}#controls button{width:44px;height:36px;font-size:16px}#padCenter{opacity:.35}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}.box{width:88vw;padding:14px;background:#20252e;border:1px solid #697282;border-radius:12px;text-align:center}.box input{width:160px;padding:8px;background:#292e37;color:#fff;border:1px solid #687282;border-radius:8px;text-align:center}
</style></head><body>
<section id="menu" class="screen"><h1>迷 宫</h1><div class="sub">经典模式</div><div id="phases" class="phases"></div><button id="fogBtn" class="menuBtn">🌫️ 迷雾模式</button><button id="adminBtn" class="smallBtn">管理</button><button id="resetBtn" class="smallBtn">重置</button></section>
<section id="phaseMenu" class="screen hidden"><h1 id="phaseTitle">阶段 1</h1><div id="phaseLevels" class="levels"></div><button id="phaseBack" class="menuBtn">← 返回</button></section>
<section id="fogMenu" class="screen hidden"><h1>🌫️ 迷雾模式</h1><div id="fogLevels" class="fogLevels"></div><button id="fogBack" class="menuBtn">← 返回</button></section>
<section id="game" class="screen hidden"><div id="bar"><button id="back">←</button><b id="title"></b><span id="status"></span></div>
<div id="gameArea"><div id="mazeStage"><canvas id="cv"></canvas></div><div id="controls"><button data-d="0,-1">▲</button><div><button data-d="-1,0">◀</button><button id="padCenter" disabled>●</button><button data-d="1,0">▶</button></div><button data-d="0,1">▼</button></div></div></section>
<section id="complete" class="screen hidden"><h1>通关！</h1><p id="ct"></p><button id="next" class="menuBtn"></button><button id="cm" class="menuBtn">返回</button></section>
<div id="modal" class="modal hidden"><div class="box"><h2 id="mt"></h2><p id="mx"></p><input id="mi" type="password" inputmode="numeric"><br><button id="mok" class="menuBtn">确定</button><button id="mno" class="menuBtn">取消</button></div></div>
<script>
"use strict";
const SAVE_KEY="maze_watch_save",ADMIN_KEY="maze_watch_admin";
const st={normal:new Set(),fog:new Set(),admin:false,cfg:null,a:null,s:[1,1],e:[1,1],p:[1,1],keys:[],doors:[],moving:false};
const normal=[],fog=[];
for(let i=0;i<30;i++){let z=Math.min(15+Math.floor(i*1.5),31);if(!(z&1))z--;normal.push({type:"normal",index:i,id:`${Math.floor(i/3)+1}-${i%3+1}`,phase:Math.floor(i/3)+1,w:z,h:z,doors:i>=6,d:i+1})}
for(let i=0;i<15;i++){let z=Math.min(17+Math.floor(i*1.2),31);if(!(z&1))z--;fog.push({type:"fog",index:i,id:`F-${i+1}`,w:z,h:z,d:i+1})}
const $=x=>document.getElementById(x);
const screens=[$("menu"),$("phaseMenu"),$("fogMenu"),$("game"),$("complete")];
function show(x){screens.forEach(s=>s.classList.add("hidden"));x.classList.remove("hidden")}

// 存储适配
const Storage={isWatch:typeof require!=="undefined",get:function(k,cb){if(this.isWatch){try{require("@system.storage").get({key:k,success:d=>cb(d?d.value:null),fail:()=>cb(null)})}catch(e){cb(null)}}else{try{cb(localStorage.getItem(k))}catch(e){cb(null)}}},set:function(k,v){if(this.isWatch){try{require("@system.storage").set({key:k,value:v})}catch(e){}}else{try{localStorage.setItem(k,v)}catch(e){}}},remove:function(k){if(this.isWatch){try{require("@system.storage").delete({key:k})}catch(e){}}else{try{localStorage.removeItem(k)}catch(e){}}}};

function save(){Storage.set(SAVE_KEY,JSON.stringify({v:6,normal:[...st.normal],fog:[...st.fog],admin:st.admin,t:Date.now()}))}
function load(){Storage.get(SAVE_KEY,function(d){if(d){try{let o=JSON.parse(d);if(o.v===6){st.normal=new Set(o.normal||[]);st.fog=new Set(o.fog||[]);st.admin=o.admin||false}}catch(e){}}renderPhases();renderFog();})}
function all(){return st.admin||st.normal.size===30}
function unlocked(arr,i,set){return st.admin||i===0||set.has(i-1)}

// 渲染阶段列表（主菜单）
function renderPhases(){
  $("phases").innerHTML="";
  for(let p=1;p<=10;p++){
    let b=document.createElement("button");
    let phaseLevels=normal.filter(l=>l.phase===p);
    let done=phaseLevels.filter(l=>st.normal.has(l.index)).length;
    let total=phaseLevels.length;
    let firstIdx=phaseLevels[0].index;
    let isUnlock=st.admin||p===1||st.normal.has(firstIdx-1);
    b.className="phase "+(done===total?"done ":"")+(isUnlock?"":"lock");
    b.disabled=!isUnlock;
    b.textContent=`阶段${p}\n${done}/${total}`;
    b.onclick=()=>{if(isUnlock)showPhase(p)};
    $("phases").appendChild(b);
  }
}

// 显示阶段内关卡
function showPhase(p){
  $("phaseTitle").textContent=`阶段 ${p}`;
  $("phaseLevels").innerHTML="";
  let phaseLevels=normal.filter(l=>l.phase===p);
  phaseLevels.forEach((v,i)=>{
    let b=document.createElement("button");
    let realIndex=v.index;
    let isUnlock=unlocked(normal,realIndex,st.normal);
    let done=st.normal.has(realIndex);
    b.className="level "+(done?"done ":"")+(isUnlock?"":"lock");
    b.disabled=!isUnlock;
    b.textContent=done?v.id+" ✓":isUnlock?v.id:v.id+" 🔒";
    b.onclick=()=>{if(isUnlock)start(v)};
    $("phaseLevels").appendChild(b);
  });
  show($("phaseMenu"));
}

// 渲染迷雾关卡
function renderFog(){
  $("fogLevels").innerHTML="";
  fog.forEach((v,i)=>{
    let b=document.createElement("button");
    let isUnlock=st.admin||i===0||st.fog.has(i-1);
    let done=st.fog.has(i);
    b.className="fogLevel "+(done?"done ":"")+(isUnlock?"":"lock");
    b.disabled=!isUnlock;
    b.textContent=done?v.id+" ✓":isUnlock?v.id:v.id+" 🔒";
    b.onclick=()=>{if(isUnlock)start(v)};
    $("fogLevels").appendChild(b);
  });
}

function maze(w,h){
 if(!(w&1))w--;if(!(h&1))h--;let a=Array.from({length:h},()=>Array(w).fill(0)),q=[[1,1]];a[1][1]=1;
 while(q.length){let [x,y]=q[q.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=0;
  for(let [dx,dy] of ds){let X=x+dx,Y=y+dy;if(X>0&&X<w-1&&Y>0&&Y<h-1&&!a[Y][X]){a[y+dy/2][x+dx/2]=1;a[Y][X]=1;q.push([X,Y]);ok=1;break}}if(!ok)q.pop()}
 let leaves=[];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)if(a[y][x]){let n=(a[y-1][x]?1:0)+(a[y+1][x]?1:0)+(a[y][x-1]?1:0)+(a[y][x+1]?1:0);if(n===1)leaves.push([x,y])}
 let s=[1,1],e=[w-2,h-2],best=-1;for(let A of leaves)for(let B of leaves){let d=Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1]);if(d>best){best=d;s=A;e=B}}return[a,s,e]
}
function path(a,s,e){let q=[s],pr=new Map(),K=(x,y)=>x+","+y;pr.set(K(...s),null);while(q.length){let [x,y]=q.shift();if(x===e[0]&&y===e[1]){let o=[],c=[x,y];while(c){o.push(c);c=pr.get(K(...c))}return o.reverse()}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let X=x+dx,Y=y+dy,k=K(X,Y);if(Y>=0&&Y<a.length&&X>=0&&X<a[0].length&&a[Y][X]&&!pr.has(k)){pr.set(k,[x,y]);q.push([X,Y])}}}return[]}
function valid(a,s,e){let h=a.length,w=a[0].length;for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++)if(a[y][x]&&a[y+1][x]&&a[y][x+1]&&a[y+1][x+1])return false;return path(a,s,e).length>0}
function gen(c){for(let i=0;i<40;i++){let m=maze(c.w,c.h);if(valid(...m))return m}return maze(c.w,c.h)}

function setupDoors(c){
 st.keys=[];st.doors=[];
 if(c.type!=="normal"||!c.doors)return;
 let p=path(st.a,st.s,st.e);if(!p||p.length<15)return;
 let n=c.d>=23?2:1;n=Math.min(n,4);
 let used=new Set();
 for(let i=0;i<n;i++){
  let kIdx=Math.floor(p.length*(.2+i*.18)),dIdx=Math.min(p.length-3,kIdx+Math.max(7,Math.floor(p.length*.12)));
  if(dIdx<=kIdx+2)continue;
  while(used.has(kIdx)&&kIdx<dIdx-3)kIdx++;
  while(used.has(dIdx)&&dIdx>kIdx+3)dIdx--;
  if(used.has(kIdx)||used.has(dIdx))continue;
  used.add(kIdx);used.add(dIdx);
  st.keys.push({x:p[kIdx][0],y:p[kIdx][1],got:false,i});
  st.doors.push({x:p[dIdx][0],y:p[dIdx][1],open:false,i});
 }
}

function start(c){st.cfg=c;let m=gen(c);st.a=m[0];st.s=m[1];st.e=m[2];st.p=[...st.s];setupDoors(c);$("title").textContent=c.type==="fog"?"🌫️ "+c.id:"关卡 "+c.id;upd();show($("game"));resize();draw()}
const cv=$("cv"),ctx=cv.getContext("2d");
function resize(){if(!st.a)return;let stage=$("mazeStage"),w=st.a[0].length,h=st.a.length,c=Math.max(2,Math.floor(Math.min((stage.clientWidth-2)/w,(stage.clientHeight-2)/h)));cv.width=w*c;cv.height=h*c;cv.dataset.c=c}
function vis(x,y){return st.cfg.type!=="fog"||Math.abs(x-st.p[0])+Math.abs(y-st.p[1])<=3}
function draw(){let c=+cv.dataset.c||4;ctx.fillStyle="#080a0f";ctx.fillRect(0,0,cv.width,cv.height);for(let y=0;y<st.a.length;y++)for(let x=0;x<st.a[0].length;x++){if(!vis(x,y))continue;ctx.fillStyle=st.a[y][x]?"#e7eaf0":"#2c313a";ctx.fillRect(x*c,y*c,c,c)}
 function box(x,y,color){ctx.fillStyle="#111";ctx.fillRect(x*c+.08*c,y*c+.08*c,.84*c,.84*c);ctx.fillStyle=color;ctx.fillRect(x*c+.18*c,y*c+.18*c,.64*c,.64*c)}
 if(vis(...st.s))box(...st.s,"#21e66b");if(vis(...st.e))box(...st.e,"#ff334c");
 for(let k of st.keys)if(!k.got&&vis(k.x,k.y))box(k.x,k.y,"#ffd21a");for(let d of st.doors)if(!d.open&&vis(d.x,d.y))box(d.x,d.y,"#b126ff");
 ctx.fillStyle="#2585ff";ctx.beginPath();ctx.arc(st.p[0]*c+c/2,st.p[1]*c+c/2,Math.max(3,c*.31),0,7);ctx.fill()}
function upd(){if(st.keys.length)$("status").textContent="🔑 "+st.keys.filter(k=>k.got).length+"/"+st.keys.length;else if(st.cfg&&st.cfg.type==="fog")$("status").textContent="🌫️";else $("status").textContent=""}

function move(dx,dy){
 if(st.moving||!st.a)return;
 let x=st.p[0]+dx,y=st.p[1]+dy;
 if(y<0||x<0||y>=st.a.length||x>=st.a[0].length||!st.a[y][x])return;
 let d=st.doors.find(d=>d.x===x&&d.y===y&&!d.open);
 if(d){let k=st.keys.find(k=>k.i===d.i&&!k.got);if(!k)return;d.open=true}
 let k=st.keys.find(k=>k.x===x&&k.y===y&&!k.got);if(k)k.got=true;
 st.p=[x,y];st.moving=true;setTimeout(()=>st.moving=false,120);upd();draw();
 if(x===st.e[0]&&y===st.e[1])finish()
}

document.addEventListener("keydown",e=>{if(e.repeat||st.moving)return;let d=null,k=e.key.toLowerCase();if(k==="w"||e.key==="ArrowUp")d=[0,-1];if(k==="s"||e.key==="ArrowDown")d=[0,1];if(k==="a"||e.key==="ArrowLeft")d=[-1,0];if(k==="d"||e.key==="ArrowRight")d=[1,0];if(d){e.preventDefault();move(...d)}})
document.querySelectorAll("#controls [data-d]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();move(...b.dataset.d.split(",").map(Number))}));
let ts=null;cv.addEventListener("touchstart",e=>{let t=e.changedTouches[0];ts=[t.clientX,t.clientY]},{passive:true});cv.addEventListener("touchend",e=>{if(!ts)return;let t=e.changedTouches[0],dx=t.clientX-ts[0],dy=t.clientY-ts[1];ts=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1)},{passive:true})

function finish(){
 let c=st.cfg;
 if(c.type==="normal"){st.normal.add(c.index);save();$("ct").textContent="完成 "+c.id+"！";$("next").textContent=c.index<29?"下一关":"返回";$("next").onclick=()=>{if(c.index<29){let next=normal[c.index+1];if(next.phase!==c.phase)showPhase(next.phase);start(next)}else{renderPhases();show($("menu"))}}}
 else if(c.type==="fog"){st.fog.add(c.index);$("ct").textContent="完成 "+c.id+"！";$("next").textContent="返回";$("next").onclick=()=>{renderFog();show($("fogMenu"))}}
 show($("complete"))
}
function modal(title,text,cb){$("mt").textContent=title;$("mx").textContent=text;$("mi").value="";$("modal").classList.remove("hidden");$("mok").onclick=()=>{$("modal").classList.add("hidden");cb($("mi").value)};$("mno").onclick=()=>$("modal").classList.add("hidden")}
$("adminBtn").onclick=()=>modal("管理员","请输入密码。",v=>{if(v==="235689850525"){st.admin=true;st.normal=new Set([...Array(30).keys()]);st.fog=new Set([...Array(15).keys()]);Storage.set(ADMIN_KEY,"1");save();renderPhases();renderFog()}else alert("密码错误")});
$("resetBtn").onclick=()=>modal("确认重置","请输入 RESET。",v=>{if(v==="RESET"){st.normal.clear();st.fog.clear();st.admin=false;Storage.remove(ADMIN_KEY);Storage.remove(SAVE_KEY);save();renderPhases();renderFog();alert("已重置")}});
$("fogBtn").onclick=()=>{if(all()){renderFog();show($("fogMenu"))}};$("fogBack").onclick=()=>show($("menu"));$("phaseBack").onclick=()=>show($("menu"));
$("back").onclick=()=>{st.a=null;if(st.cfg&&st.cfg.type==="fog"){renderFog();show($("fogMenu"))}else{renderPhases();show($("menu"))}};
$("cm").onclick=()=>{if(st.cfg&&st.cfg.type==="fog"){renderFog();show($("fogMenu"))}else{renderPhases();show($("menu"))}};
function refresh(){if(st.a){resize();draw()}}addEventListener("resize",refresh);addEventListener("orientationchange",()=>setTimeout(refresh,150));if(visualViewport)visualViewport.addEventListener("resize",refresh);
load();
</script></body></html>
